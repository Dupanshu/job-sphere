<!DOCTYPE html>
<html dir="ltr" lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="author" content="Dupanshu">
    <meta name="description" content="Job Finder">
    <meta name="keywords" content="html, css,APIs, javascript">
    <title>Login | Jobsphere</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="icon" href="./assets/img/logo.png" type="image/x-icon">
    <link rel="stylesheet" href="./assets/css/index.css">
    <script src="./assets/js/app.js" type="module"></script>
  </head>
  <body>
    <main>
      <div class="flex-login">
        <div class="bg-img">
          <div class="bg-img-flex">
            <img src="./assets/img/logo.png" alt="logo">
            <h1>Jobsphere</h1>
          </div>
        </div>
        <div class="login-sec">
          <div class="login_sec_div">
            <p class="welcome">Welcome</p>
            <input type='text' placeholder='Username' class='username'>
            <input type='text' placeholder='Password' class='password'>
            <button class="login">Login</button>
            <button class="register">Sign up</button>
            <div class="bottom">
              <p>or login through <span class="blue"><i class="fa-brands fa-google"></i>or<i class="fa-brands fa-facebook-f"></i></span></p>
            </div>
            <div class="message"><p>Incorrect username or password!</p>
            <a href="https://github.com/Dupanshu/job-sphere/blob/jobsphere1/README.md">Go to Docs</a></div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
